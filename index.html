<title>Daily — Habit Tracker</title>
<style>
:root{
  --bg:#0e1117; --bg2:#161a23; --card:#1a1f2b; --card2:#222836;
  --line:#2a3140; --txt:#e9edf5; --dim:#8b96a9; --dim2:#5f6a7d;
  --ok:#3ddc84; --warn:#f5b242; --roll:#ff9f45; --acc:#4a9eff;
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:calc(76px + var(--safeB))}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
.hdr{position:sticky;top:0;z-index:50;background:rgba(14,17,23,.86);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);padding:calc(8px + var(--safeT)) 14px 10px}
.hdr h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.hdr .sub{color:var(--dim);font-size:13px;margin-top:2px}
.row{display:flex;align-items:center;gap:8px}
.spread{justify-content:space-between}
.wrap{padding:12px 12px 24px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.partHead{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--card2);border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.partHead .nm{font-weight:700;font-size:15px;letter-spacing:-.2px}
.partHead .tag{color:var(--dim);font-size:12px;font-weight:500}
.pct{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.mini{height:4px;border-radius:3px;background:#2c3444;width:52px;overflow:hidden;margin-left:8px}
.mini i{display:block;height:100%;border-radius:3px;transition:width .25s}
.sess{padding:11px 13px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:none}
.sTop{display:flex;align-items:flex-start;gap:11px}
.tick{width:29px;height:29px;border-radius:9px;border:2px solid #39435a;background:transparent;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;cursor:pointer;transition:.15s}
.tick svg{width:16px;height:16px;opacity:0;transform:scale(.6);transition:.15s}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on svg{opacity:1;transform:scale(1)}
.sName{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.sName.done{color:var(--dim);text-decoration:line-through;text-decoration-color:#4c5768}
.sId{color:var(--dim2);font-size:11px;font-weight:700;letter-spacing:.5px;margin-right:6px}
.rollBtn{margin-left:auto;flex:0 0 auto;border:1px solid #39435a;background:transparent;color:var(--dim);
  border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.rollBtn.on{background:rgba(255,159,69,.16);border-color:var(--roll);color:var(--roll)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 40px}
.chip{border:1px solid #39435a;background:transparent;color:var(--dim);border-radius:999px;
  padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(74,158,255,.18);border-color:var(--acc);color:#9dc9ff}
.work{margin:9px 0 0 40px}
.work textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;color:var(--txt);resize:none;line-height:1.4;font-size:14.5px;min-height:38px;display:block}
.work textarea::placeholder{color:var(--dim2)}
.carry{margin:8px 0 0 40px;font-size:12px;color:var(--roll);font-weight:600}
.dateBar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dateBar button{background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:8px 12px;font-weight:700;cursor:pointer}
.dateBar .lbl{flex:1;text-align:center;font-weight:700;font-size:15px}
.dateBar .lbl small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(18,22,30,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.nav button{flex:1;background:none;border:none;color:var(--dim2);padding:9px 2px 8px;
  font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button.on{color:var(--acc)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:20px 2px 9px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.25}
.hm{display:flex;flex-wrap:wrap;gap:3px;padding:12px}
.hm i{width:calc((100% - 39px)/14);aspect-ratio:1;border-radius:3px;background:#222836;display:block}
input.search,select.sel{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;color:var(--txt);margin-bottom:10px;-webkit-appearance:none}
.logDay{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.logDay>.h{padding:10px 13px;background:var(--card2);font-weight:700;font-size:14px;display:flex;
  justify-content:space-between;align-items:center;cursor:pointer}
.logDay>.h .p{font-size:12px;color:var(--dim);font-weight:600}
.logRow{padding:8px 13px;border-top:1px solid var(--line);font-size:14px;display:flex;gap:9px;align-items:flex-start}
.badge{font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;flex:0 0 auto;margin-top:1px}
.b-ok{background:rgba(61,220,132,.16);color:var(--ok)}
.b-roll{background:rgba(255,159,69,.16);color:var(--roll)}
.b-no{background:rgba(139,150,169,.14);color:var(--dim)}
.logRow .t{flex:1;min-width:0}
.logRow .t small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--dim2);padding:36px 20px;font-size:14px;line-height:1.5}
.btn{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:13px;padding:13px;font-weight:700;margin-bottom:9px;cursor:pointer;display:block}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04121f}
.btn.dgr{color:#ff6b6b}
textarea.paste{width:100%;min-height:130px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px;color:var(--txt);font-family:ui-monospace,Menlo,monospace;font-size:13px;margin-bottom:9px}
.mrow{display:flex;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-child{border-bottom:none}
.mrow b{font-variant-numeric:tabular-nums;font-weight:700}
.chart{padding:8px 4px 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.tabs button.on{background:rgba(74,158,255,.16);border-color:var(--acc);color:#9dc9ff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safeB));
  background:#eef2f8;color:#101520;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;
  z-index:200;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;bottom:calc(100px + var(--safeB))}
.misc textarea{width:100%;min-height:110px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;color:var(--txt);line-height:1.45;font-size:15px}
.hint{color:var(--dim2);font-size:12.5px;line-height:1.5;padding:0 3px 10px}
.wk{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:none}
.wk .n{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .d{display:flex;gap:3px}
.wk .d i{width:13px;height:13px;border-radius:4px;background:#2a3140;display:block}
.wk .c{font-size:12px;color:var(--dim);font-weight:700;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.sTime{color:var(--dim2);font-size:12px;font-weight:500;margin-top:2px}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 0 40px}
.nums.flat{margin:0;padding:11px 13px}
.nums label{flex:1 1 130px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--dim);font-weight:600}
.nums label.wide{flex-basis:100%}

</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ---------------- config ---------------- */
// New day-by-day checklists start on this date. Earlier days keep the old list exactly as logged.
var EFFECTIVE="2026-10-19";
var COLORS={A:"#f5b242",B:"#3ddc84",C:"#4a9eff",D:"#a878ff",E:"#8fa0b8",F:"#ff7eb3"};

/* ---------------- old checklist (days before EFFECTIVE) ---------------- */
var LEGACY=[
 {id:"A",tag:"Pre-dawn",color:"#f5b242",s:[
   {id:"A1",label:"Wake @ 4am"},
   {id:"A2",label:"Mobility"},
   {id:"A3",label:"Visualisation"}]},
 {id:"B",tag:"Morning",color:"#3ddc84",s:[
   {id:"B1",label:"Tennis / Weights / Cycle",o:["Tennis","Weights","Cycle"]},
   {id:"B2",label:"Drop Avyaan"},
   {id:"B3",label:"Ankit / Podcast / Weights",o:["Ankit","Podcast","Weights"]},
   {id:"B4",label:"Swim / Cycle",o:["Swim","Cycle"]}]},
 {id:"C",tag:"Office",color:"#4a9eff",s:[
   {id:"C1",label:"Office Mtg"},
   {id:"C2",label:"Appear / Review / Connect / Read",o:["Appear","Review","Connect","Read"]},
   {id:"C3",label:"Lunch"}]},
 {id:"D",tag:"Afternoon",color:"#a878ff",s:[
   {id:"D1",label:"Appear / Review / Connect / Bills",o:["Appear","Review","Connect","Bills"]},
   {id:"D2",label:"Swim / Walk / Yoga",o:["Swim","Walk","Yoga"]}]},
 {id:"E",tag:"Evening",color:"#8fa0b8",s:[
   {id:"E1",label:"Re-focus"},
   {id:"E2",label:"R&W / Xtra time",o:["R&W","Xtra time"]},
   {id:"E3",label:"Shut off"}]}
];

/* ---------------- new checklists (from EFFECTIVE) ---------------- */
var TENNIS_O=["Drills","Points & patterns","Match play"];
var RT_O=["Annotate source","Evidence matrix","300-word note"];
var RT_SAT_O=["Annotate source","Evidence matrix","300-word note","Interview / lecture","Weekly log"];
function P(id,tag,s){return{id:id,tag:tag,color:COLORS[id],s:s.filter(Boolean)};}
function weekdayParts(w,court){
  var train={1:["Mobility + core",["Mobility","Core","Activation"]],3:["Mobility + core",["Mobility","Core","Activation"]],5:["Mobility + core",["Mobility","Core","Activation"]],
             2:["Strength A — legs & core"],4:["Strength B — shoulders, back & rotation"]}[w];
  var ms={2:{label:"Walk"},4:{label:"Physio"}}[w]||{label:"Tennis",o:TENNIS_O,tennis:1};
  var deep={1:"Deep work — billable matter work",2:"Deep work — counsel BD: pitch or follow-up to a firm",3:"Deep work — billable matter work",
            4:"Deep work — court craft: record a 5-min argument",5:"Deep work — billing review (30 min) + roadmap exercise (60 min)"}[w];
  return [
    P("A","Pre-dawn",[
      {id:"wake",label:"Wake @ 5:05 + pre-training snack",time:"5:05 · half banana + almonds"},
      {id:"med1",label:"Meditation 1 (7 min)",time:"5:15–5:22"},
      {id:"train",label:train[0],o:train[1],time:"5:25–6:20"}]),
    P("B","Morning",[
      {id:"avyaan",label:"Avyaan time",time:"6:30–7:30",o:["Bath & ready","Indoor cricket (10 min)","School drive"],ph:"What we talked about…"},
      {id:"msess",label:ms.label,o:ms.o,tennis:ms.tennis,time:"7:30–8:30"},
      {id:"bfast",label:"Breakfast + medication as prescribed",time:"8:30–9:15"}]),
    P("C","Commute & counsel",[
      {id:"car",label:"Car study (audio)",time:"9:15–10:15",ph:"3 lines learned…",book:1},
      {id:"assign",label:"Assign juniors the day's work",time:"10:30"},
      court?{id:"court",label:"Court hearing",time:"10:30–3:30"}:{id:"cb1",label:"Counsel block 1 — deep",time:"10:30–1:15"},
      {id:"rtomb",label:"Lunch + Rahim's Tomb research (30 min)",time:"1:15–1:45",o:RT_O,ph:"Source read / row updated / note…"},
      {id:"lunch",label:"Walking pad (15 min)",time:"1:45–2:00 · after lunch"},
      court?null:{id:"cb2",label:"Counsel block 2",time:"2:00–3:30"}]),
    P("D","Afternoon",[
      {id:"admin",label:"Billing, BD & admin",time:"3:30–4:00",o:["Bills raised","Bills chased","Junior review","BD","Email"]},
      (w===5&&!court)?{id:"pad",label:"Rahim's Tomb site visit",time:"4:00–5:15 · 9 min each way",o:["Site visit","No visit this week","Meditation 2"],ph:"Visit ID, zones, photo IDs, 3 open questions…"}
                     :{id:"med2",label:"Meditation 2 (7 min)",time:"4:00–4:07"},
      (w===5&&!court)?{id:"med2",label:"Meditation 2 (7 min)",time:"5:15, back from the visit"}
                     :{id:"open",label:"Open block",time:"4:07–5:10",o:["BD","Exercise","Recharge","Xtra work"],ph:"What I used it for…"}]),
    P("E","Evening",[
      court?null:{id:"deep",label:deep,time:"5:15–7:15 · dinner break 6:30–6:45"},
      {id:"dinner",label:"Dinner at office",time:"6:30–6:45"},
      {id:"shut",label:"Tomorrow's to-dos + shutdown",time:"7:15–7:30"},
      {id:"bill",label:"Billing numbers",time:"today's hours",num:[["my","My billable hrs"],["team","Team billable hrs"]]}]),
    P("F","Night",[
      {id:"carhome",label:"Screen-free car home",time:"7:30 · western classical"},
      {id:"lights",label:"Lights out by 9:30",time:"target 9:15–9:30",timeIn:1}])
  ];
}
function satParts(){
  return [
    P("A","Relaxed start",[
      {id:"wake",label:"Relaxed morning — up by 6:30 + snack",time:"no alarm before 6:30"},
      {id:"med1",label:"Meditation 1 (7 min)"}]),
    P("B","Morning",[
      {id:"nets",label:"Cricket + fitness",time:"6:30–9:00",o:["Cricket","Fitness","Glucose tablets packed"]},
      {id:"avyaan",label:"Avyaan",time:"late morning",o:["Reading","Cricket","Tennis","Unstructured fun"],ph:"What we did…"}]),
    P("C","Midday",[
      {id:"ride",label:"Long cycling session",time:"11:00–1:00",o:["Glucose tablets packed","Electrolytes"],num:[["min","Minutes"]]},
      {id:"nap",label:"Lunch + nap 20–30 min",time:"after the ride"}]),
    P("E","Evening",[
      {id:"rtomb",label:"Rahim's Tomb reading",time:"7:00–8:30 pm",o:RT_SAT_O,ph:"What I read or wrote; next single action…"},
      {id:"med2",label:"Meditation 2 (7 min)"}]),
    P("F","Night",[
      {id:"lights",label:"Lights out by 9:30",timeIn:1}])
  ];
}
function sunParts(){
  return [
    P("A","Morning",[
      {id:"wake",label:"Wake + snack",time:"before the match"},
      {id:"med1",label:"Meditation 1 (7 min)"},
      {id:"ltennis",label:"Cricket or tennis match",time:"until 11:00",o:["Tennis match","Cricket match","Glucose tablets packed"],tennis:1},
      {id:"rest",label:"Rest & recovery",time:"after the match",o:["Stretch","Foam roll","Nap"]}]),
    P("C","Second half",[
      {id:"avyaan",label:"Quality time with Avyaan",o:["Tennis","Cricket","Watching sports","Reading","Unstructured fun"],ph:"What we did…"},
      {id:"review",label:"Weekly review",time:"6:00 pm · 15 min",link:"review"}]),
    P("E","Evening",[
      {id:"med2",label:"Meditation 2 (7 min)"}]),
    P("F","Night",[
      {id:"lights",label:"Lights out by 9:15",timeIn:1}])
  ];
}
function index(parts){var items=[],map={};parts.forEach(function(p){p.s.forEach(function(s){s.part=p.id;items.push(s);map[s.id]=s;});});return{parts:parts,items:items,map:map};}
var LEG=index(LEGACY),TMEMO={};
function isNew(date){return date>=EFFECTIVE;}
function dow(date){return parse(date).getDay();}
function isWeekday(date){var w=dow(date);return w>=1&&w<=5;}
function tpl(date){
  if(!isNew(date))return LEG;
  var w=dow(date),court=(w>=1&&w<=5)&&!!(S.days[date]&&S.days[date].court),key=w+"|"+(court?1:0);
  if(!TMEMO[key])TMEMO[key]=index(w===6?satParts():w===0?sunParts():weekdayParts(w,court));
  return TMEMO[key];
}
function partsFor(date){return tpl(date).parts;}
function itemsFor(date){return tpl(date).items;}
function findItem(date,id){return tpl(date).map[id]||null;}

/* catalogue of every new item (for Log › By session) */
var GEN={rtomb:"Rahim's Tomb research",pad:"Friday site visit",lunch:"Walking pad after lunch",open:"Open block (4:07–5:10)",wake:"Wake + snack",train:"Morning training",msess:"Morning session (tennis / walk / physio)",avyaan:"Avyaan time",
  deep:"Evening deep work",pad:"Walking pad block",lights:"Lights out",cb1:"Counsel block 1",cb2:"Counsel block 2"};
var CAT=[],CATMAP={};
(function(){
  [1,2,3,4,5].forEach(function(w){[0,1].forEach(function(c){index(weekdayParts(w,c)).items.forEach(add);});});
  index(satParts()).items.forEach(add);index(sunParts()).items.forEach(add);
  function add(s){
    if(!CATMAP[s.id]){var c={id:s.id,label:GEN[s.id]||s.label,o:s.o?s.o.slice():null,part:s.part};CATMAP[s.id]=c;CAT.push(c);}
    else if(s.o){var e=CATMAP[s.id];e.o=e.o||[];s.o.forEach(function(o){if(e.o.indexOf(o)<0)e.o.push(o);});}
  }
})();
function anyItem(id){return CATMAP[id]||LEG.map[id]||null;}

/* ---------------- storage ---------------- */
var KEY="daily_tracker_v1", MEM=null;
function blank(){return{v:2,days:{},metrics:{},settings:{book:"",target:""},reviews:{},created:iso(new Date())};}
function fix(d){d.days=d.days||{};d.metrics=d.metrics||{};d.settings=d.settings||{};d.reviews=d.reviews||{};
  if(d.settings.book==null)d.settings.book="";if(d.settings.target==null)d.settings.target="";d.v=2;return d;}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return fix(JSON.parse(r));}
  catch(e){}
  return blank();
}
var S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){MEM=S;toast("⚠︎ Storage blocked — export a backup");}
}
/* ---------------- dates ---------------- */
function iso(d){var m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y;}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function pretty(s){var d=parse(s);return DAY[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function shortD(s){var d=parse(s);return d.getDate()+" "+MON[d.getMonth()];}
function today(){return iso(new Date());}
function mondayOf(s){var d=parse(s),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}

/* ---------------- day records ---------------- */
function day(date,make){
  var d=S.days[date];
  if(!d){
    if(!make)return null;
    d={sessions:{},misc:"",carry:{},court:0};
    var prev=S.days[shift(date,-1)];
    if(prev){
      Object.keys(prev.sessions||{}).forEach(function(id){
        var pr=prev.sessions[id];
        if(pr&&pr.r) d.carry[id]=((prev.carry&&prev.carry[id])||0)+1;
      });
    }
    S.days[date]=d;save();
  }
  if(!d.carry)d.carry={};
  return d;
}
function ses(date,id){
  var d=day(date,true);
  if(!d.sessions[id])d.sessions[id]={d:0,r:0,w:"",o:""};
  return d.sessions[id];
}
function getS(date,id){var d=S.days[date];return(d&&d.sessions&&d.sessions[id])||null;}
function optArr(o){if(!o)return[];if(Array.isArray(o))return o.slice();return[o];}
function optStr(o,j){return optArr(o).join(j||" · ");}
function num(v,k){return(v&&v.n&&v.n[k]!=null&&v.n[k]!=="")?+v.n[k]:null;}
function dayPct(date){
  var d=S.days[date];if(!d)return null;var it=itemsFor(date),n=0;
  it.forEach(function(x){var v=d.sessions[x.id];if(v&&v.d)n++;});
  return it.length?n/it.length:0;
}
function partPct(date,pid){
  var d=S.days[date];if(!d)return 0;var p=null;
  partsFor(date).forEach(function(q){if(q.id===pid)p=q;});
  if(!p||!p.s.length)return 0;var n=0;
  p.s.forEach(function(x){var v=d.sessions[x.id];if(v&&v.d)n++;});
  return n/p.s.length;
}
function hasPart(date,pid){return partsFor(date).some(function(q){return q.id===pid;});}

/* ---------------- core score ---------------- */
function coreChecks(date){
  if(!isNew(date))return null;
  var w=dow(date);
  if(w===6)return[["med1"],["med2"],["nets","ride"],["lights"]];
  if(w===0)return[["med1"],["med2"],["ltennis"],["lights"]];
  var court=!!(S.days[date]&&S.days[date].court);
  return[["med1"],["med2"],["train","msess"]].concat(court?[["court"]]:[["cb1"],["cb2"]]).concat(["bill",["carhome"],["lights"]]);
}
function checkOk(date,c){
  if(c==="bill")return num(getS(date,"bill"),"team")!==null;
  return c.some(function(id){var v=getS(date,id);return !!(v&&v.d);});
}
function coreScore(date){
  var cs=coreChecks(date);if(!cs)return null;var n=0;
  cs.forEach(function(c){if(checkOk(date,c))n++;});
  return{n:n,t:cs.length,p:n/cs.length};
}
function goodDay(date){if(!S.days[date])return false;var c=coreScore(date);return !!(c&&c.p>=0.75);}
function goodStreak(){
  var t=today(),k=goodDay(t)?t:shift(t,-1),c=0;
  while(k>=EFFECTIVE&&goodDay(k)){c++;k=shift(k,-1);}
  return c;
}

/* ---------------- streaks (skip days an item isn't scheduled) ---------------- */
function scheduled(date,id){return !!findItem(date,id);}
function streak(id){
  var t=today(),c=0,k=t,cur=getS(t,id),legacy=!!LEG.map[id];
  if(!(cur&&cur.d))k=shift(t,-1);
  for(var g=0;g<500;g++){
    if(!scheduled(k,id)){if(!legacy&&k<EFFECTIVE)break;k=shift(k,-1);continue;}
    var v=getS(k,id);if(v&&v.d){c++;k=shift(k,-1);}else break;
  }
  return c;
}
function bestStreak(id){
  var ks=Object.keys(S.days).sort();if(!ks.length)return 0;
  var k=ks[0],t=today(),best=0,run=0;
  for(var g=0;g<2000&&k<=t;g++){
    if(scheduled(k,id)){var v=getS(k,id);if(v&&v.d){run++;if(run>best)best=run;}else if(k<t)run=0;}
    k=shift(k,1);
  }
  return best;
}
function daysBack(n){var a=[],t=today();for(var i=n-1;i>=0;i--)a.push(shift(t,-i));return a;}

/* ---------------- weekly aggregates ---------------- */
var TRAIN_IDS=["train","msess","nets","ride","ltennis"];
function weekStats(ws){
  var r={rt:0,rtMin:0,rtN:0,my:0,team:0,hasMy:0,hasTeam:0,coreSum:0,coreN:0,good:0,lightsDone:0,lightsN:0,tennis:0,med:0,medN:0,train:0,w:0,l:0,matches:[],newDays:0,types:{}};
  TENNIS_O.forEach(function(o){r.types[o]=0;});
  for(var i=0;i<7;i++){
    var k=shift(ws,i);if(k>today())continue;
    var d=S.days[k];if(!d||!isNew(k))continue;
    r.newDays++;
    var b=getS(k,"bill"),my=num(b,"my"),tm=num(b,"team");
    if(my!==null){r.my+=my;r.hasMy=1;} if(tm!==null){r.team+=tm;r.hasTeam=1;}
    var c=coreScore(k);r.coreSum+=c.p;r.coreN++;if(c.p>=.75)r.good++;
    if(scheduled(k,"rtomb")){r.rtN++;var rt=getS(k,"rtomb");if(rt&&rt.d){r.rt++;r.rtMin+=dow(k)===6?90:30;}}
    if(dow(k)===5){var sv=getS(k,"pad");if(sv&&optArr(sv.o).indexOf("Site visit")>=0){r.visits=(r.visits||0)+1;r.rtMin+=60;}}
    if(scheduled(k,"lights")){r.lightsN++;var l=getS(k,"lights");if(l&&l.d)r.lightsDone++;}
    ["med1","med2"].forEach(function(id){if(scheduled(k,id)){r.medN++;var v=getS(k,id);if(v&&v.d)r.med++;}});
    TRAIN_IDS.forEach(function(id){if(scheduled(k,id)){var v=getS(k,id);if(v&&v.d)r.train++;}});
    ["msess","ltennis"].forEach(function(id){
      var it=findItem(k,id);if(!it||!it.tennis)return;var v=getS(k,id);if(!v)return;
      if(id==="ltennis"&&optArr(v.o).indexOf("Tennis match")<0)return;
      if(v.d){r.tennis++;optArr(v.o).forEach(function(o){if(r.types[o]!=null)r.types[o]++;});}
      if(v.m&&(v.m.wl==="W"||v.m.wl==="L")){if(v.m.wl==="W")r.w++;else r.l++;r.matches.push([k,v.m]);}
    });
  }
  return r;
}
function weeks(n){var m=mondayOf(today()),a=[];for(var i=n-1;i>=0;i--)a.push(shift(m,-7*i));return a;}
function share(my,team){return(my+team)>0?Math.round(team/(my+team)*100)+"%":"—";}
function allMatches(){
  var a=[];Object.keys(S.days).sort().forEach(function(k){
    ["msess","ltennis"].forEach(function(id){var v=getS(k,id);if(v&&v.m&&(v.m.wl||v.m.opp||v.m.score))a.push([k,v.m]);});
  });return a;
}

/* ---------------- ui helpers ---------------- */
var V=document.getElementById("view"),TT=document.getElementById("toast");
var tmr;
function toast(m){TT.textContent=m;TT.classList.add("on");clearTimeout(tmr);tmr=setTimeout(function(){TT.classList.remove("on");},1700);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shade(p){
  if(p==null)return "#222836";
  if(p<=0)return "#252b39";
  if(p<.25)return "#1c4c33";
  if(p<.5)return "#226b45";
  if(p<.75)return "#2c9d5f";
  if(p<1)return "#35c274";
  return "#3ddc84";
}
var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="#08210f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
function extra(v){
  if(!v)return "";var a=[];
  if(v.n){if(num(v,"my")!==null)a.push("me "+num(v,"my")+"h");if(num(v,"team")!==null)a.push("team "+num(v,"team")+"h");if(num(v,"min")!==null)a.push(num(v,"min")+" min");}
  if(v.t)a.push("lights out "+v.t);
  if(v.b)a.push("book: "+v.b);
  if(v.m&&(v.m.opp||v.m.score||v.m.wl))a.push("match"+(v.m.opp?" vs "+v.m.opp:"")+(v.m.score?" "+v.m.score:"")+(v.m.wl?" ("+v.m.wl+")":""));
  return a.join(" · ");
}

/* ---------------- TODAY ---------------- */
var curDate=today();
function hdrRight(){
  var it=itemsFor(curDate),p=dayPct(curDate)||0,c=coreScore(curDate);
  document.getElementById("hRight").innerHTML='<div style="text-align:right"><div style="font-size:20px;font-weight:800;letter-spacing:-.5px">'+Math.round(p*100)+'%</div>'+
    '<div style="font-size:11px;color:var(--dim)">'+Math.round(p*it.length)+' / '+it.length+'</div>'+

function sortOpts(id,arr){var it=findItem(curDate,id),order=(it&&it.o)||[];arr.sort(function(p,q){return order.indexOf(p)-order.indexOf(q);});return arr;}

    if(j>=0)cur.splice(j,1);else cur.push(pick);

      var mv=ses(curDate,"med2");mv.d=cur.indexOf("Meditation 2")>=0?1:0;if(mv.d)mv.r=0;
    }
  }
  else if(a==="wl"){v.m=v.m||{};v.m.wl=v.m.wl===b.dataset.w?"":b.dataset.w;}

});

var logMode="date",logQ="",logOpen={};
function vLog(){
  document.getElementById("hTitle").textContent="Log";
  document.getElementById("hSub").textContent=Object.keys(S.days).length+" days recorded";
  document.getElementById("hRight").innerHTML="";
  var h='<div class="tabs">'+
    ['date|By date','sess|By session','roll|Rolled over','misc|Notes'].map(function(t){
      var a=t.split("|");return '<button data-lm="'+a[0]+'"'+(logMode===a[0]?' class="on"':'')+'>'+a[1]+'</button>';}).join("")+'</div>';
  if(logMode==="date"){
    h+='<input class="search" id="q" placeholder="Search work notes, dates, sessions…" value="'+esc(logQ)+'">';
    var ks=Object.keys(S.days).sort().reverse(),any=0;
    ks.forEach(function(k){
      var d=S.days[k],hit=[];
      itemsFor(k).forEach(function(x){
        var v=d.sessions[x.id];if(!v)return;
        var ex=extra(v);
        if(!v.d&&!v.r&&!v.w&&!optArr(v.o).length&&!ex)return;
        if(logQ){
          var t=(x.label+" "+x.id+" "+(v.w||"")+" "+optStr(v.o)+" "+ex+" "+k+" "+shortD(k)).toLowerCase();
          if(t.indexOf(logQ.toLowerCase())<0)return;
        }
        hit.push([x,v,ex]);
      });
      var mm=(!logQ||(d.misc||"").toLowerCase().indexOf(logQ.toLowerCase())>=0)?d.misc:"";
      if(!hit.length&&!mm)return;
      any=1;var p=dayPct(k)||0,op=logOpen[k]!==false,c=coreScore(k);
      h+='<div class="logDay"><div class="h" data-open="'+k+'"><span>'+shortD(k)+' · '+DAY[parse(k).getDay()].slice(0,3)+(d.court?' · <span style="color:var(--warn)">court</span>':'')+'</span><span class="p">'+
         (c?'Core '+c.n+'/'+c.t+' · ':'')+Math.round(p*100)+'% · '+(op?"▾":"▸")+'</span></div>';
      if(op){
        hit.forEach(function(a){
          var x=a[0],v=a[1],ex=a[2];
          h+='<div class="logRow"><span class="badge '+(v.d?"b-ok":v.r?"b-roll":"b-no")+'">'+(v.d?"DONE":v.r?"ROLL":"—")+'</span><div class="t">'+esc(x.label)+(optArr(v.o).length?' <b style="color:var(--acc)">· '+esc(optStr(v.o))+'</b>':'')+
             (ex?'<small style="color:var(--txt)">'+esc(ex)+'</small>':'')+(v.w?'<small>'+esc(v.w)+'</small>':'')+'</div></div>';
        });
        if(mm)h+='<div class="logRow"><span class="badge b-no">NOTE</span><div class="t"><small>'+esc(mm)+'</small></div></div>';
      }
      h+='</div>';
    });
    if(!any)h+='<div class="empty">Nothing logged yet'+(logQ?' for "'+esc(logQ)+'"':'')+'.</div>';
  }
  else if(logMode==="sess"){
    h+='<select class="sel" id="ss"><option value="">— pick a session —</option>'+
      '<optgroup label="Current checklist">'+CAT.map(function(x){return '<option value="'+x.id+'"'+(logQ===x.id?" selected":"")+'>'+esc(x.label)+'</option>';}).join("")+'</optgroup>'+
      LEGACY.map(function(p){return '<optgroup label="Old list (before 19 Oct) · Part '+p.id+'">'+p.s.map(function(x){
        return '<option value="'+x.id+'"'+(logQ===x.id?" selected":"")+'>'+x.id+' — '+esc(x.label)+'</option>';}).join("")+'</optgroup>';}).join("")+'</select>';
    var x=logQ?anyItem(logQ):null;
    if(x){
      var rows=[],dn=0,rl=0;
      Object.keys(S.days).sort().reverse().forEach(function(k){
        var v=S.days[k].sessions[logQ];if(!v)return;
        if(!v.d&&!v.r&&!v.w&&!extra(v))return;
        if(v.d)dn++;if(v.r)rl++;
        rows.push([k,v]);
      });
      h+='<div class="stats" style="margin-bottom:14px"><div class="stat"><b style="color:var(--ok)">'+dn+'</b><span>days done</span></div>'+
          '<div class="stat"><b style="color:var(--roll)">'+rl+'</b><span>rolled over</span></div>'+
          '<div class="stat"><b>'+streak(logQ)+'</b><span>current streak</span></div></div>';
      if(x.o){
        var tally={};x.o.forEach(function(o){tally[o]=0;});
        rows.forEach(function(a){optArr(a[1].o).forEach(function(o){if(tally[o]!=null)tally[o]++;});});
        var mx=Math.max.apply(null,x.o.map(function(o){return tally[o];}))||1;
        h+='<div class="card">';
        x.o.forEach(function(o){
          h+='<div class="wk"><span class="n">'+esc(o)+'</span><span class="mini" style="width:110px"><i style="width:'+(tally[o]/mx*100)+'%;background:var(--acc)"></i></span><span class="c">'+tally[o]+'</span></div>';
        });
        h+='</div>';
      }
      h+='<div class="logDay"><div class="h"><span>'+esc(x.label)+'</span><span class="p">'+rows.length+' entries</span></div>';
      if(!rows.length)h+='<div class="logRow"><div class="t"><small>No entries yet.</small></div></div>';
      rows.forEach(function(a){
        var k=a[0],v=a[1],ex=extra(v);
        h+='<div class="logRow"><span class="badge '+(v.d?"b-ok":v.r?"b-roll":"b-no")+'">'+shortD(k)+'</span><div class="t">'+(optArr(v.o).length?'<b style="color:var(--acc)">'+esc(optStr(v.o))+'</b>':(v.d?"Done":v.r?"Rolled over":"—"))+
           (ex?'<small style="color:var(--txt)">'+esc(ex)+'</small>':'')+(v.w?'<small>'+esc(v.w)+'</small>':'')+'</div></div>';
      });
      h+='</div>';
    } else h+='<div class="empty">Pick a session to see every day it was done, what you did, and where it rolled over.</div>';
  }
  else if(logMode==="roll"){
    var n=0;h+='<div class="hint">Every session you marked ↻ rolled over, newest first.</div>';
    Object.keys(S.days).sort().reverse().forEach(function(k){
      var d=S.days[k],rows=[];
      itemsFor(k).forEach(function(x){var v=d.sessions[x.id];if(v&&v.r)rows.push([x,v]);});
      if(!rows.length)return;n++;
      h+='<div class="logDay"><div class="h"><span>'+shortD(k)+' · '+DAY[parse(k).getDay()].slice(0,3)+'</span><span class="p">'+rows.length+' rolled</span></div>';
      rows.forEach(function(a){
        var x=a[0],v=a[1],c=d.carry[x.id]||0;
        h+='<div class="logRow"><span class="badge b-roll">'+x.part+'</span><div class="t">'+esc(x.label)+(c?' <b style="color:var(--roll)">· '+c+'d carry</b>':'')+(v.w?'<small>'+esc(v.w)+'</small>':'')+'</div></div>';
      });
      h+='</div>';
    });
    if(!n)h+='<div class="empty">Nothing has rolled over. Clean slate.</div>';
  }
  else{
    var n2=0;
    Object.keys(S.days).sort().reverse().forEach(function(k){
      var d=S.days[k];if(!d.misc)return;n2++;
      h+='<div class="logDay"><div class="h"><span>'+shortD(k)+'</span><span class="p">'+DAY[parse(k).getDay()].slice(0,3)+'</span></div><div class="logRow"><div class="t"><small>'+esc(d.misc)+'</small></div></div></div>';
    });
    if(!n2)h+='<div class="empty">No miscellaneous notes yet.</div>';
  }
  V.innerHTML=h;
  V.querySelectorAll("[data-lm]").forEach(function(b){b.onclick=function(){logMode=b.dataset.lm;logQ="";render();};});
  var q=document.getElementById("q");
  if(q)q.addEventListener("input",function(){logQ=q.value;var p=q.selectionStart;vLog();var n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(p,p);}});
  var ss=document.getElementById("ss");
  if(ss)ss.onchange=function(){logQ=ss.value;vLog();};
  V.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){var k=b.dataset.open;logOpen[k]=(logOpen[k]===false);vLog();};});
}

var trMetric="recovery";
var METRICS=[
 {k:"recovery",n:"Whoop recovery",u:"%",c:"#3ddc84"},
 {k:"strain",n:"Whoop strain",u:"",c:"#f5b242"},
 {k:"hrv",n:"HRV",u:"ms",c:"#4a9eff"},
 {k:"rhr",n:"Resting HR",u:"bpm",c:"#ff6b8a"},
 {k:"sleep",n:"Sleep",u:"h",c:"#a878ff"},
 {k:"move",n:"Move",u:"kcal",c:"#ff9f45"},
 {k:"exercise",n:"Exercise",u:"min",c:"#3ddc84"},
 {k:"stand",n:"Stand",u:"h",c:"#4a9eff"},
 {k:"steps",n:"Steps",u:"",c:"#8fa0b8"}
];
function line(vals,color){
  var pts=vals.filter(function(p){return p[1]!=null;});
  if(pts.length<2)return '<div class="empty" style="padding:22px">Not enough data yet — needs at least 2 days.</div>';
  var W=320,H=110,ys=pts.map(function(p){return p[1];});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mx===mn){mx=mn+1;mn=mn-1;}
  var pad=(mx-mn)*.15;mn-=pad;mx+=pad;
  var n=pts.length,d="",a="";
  pts.forEach(function(p,i){
    var x=(i/(n-1))*(W-8)+4, y=H-6-((p[1]-mn)/(mx-mn))*(H-16);
    d+=(i?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";
    a+=(i?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";
  });
  a+="L"+(W-4)+","+H+" L4,"+H+" Z";
  var last=pts[pts.length-1];
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:120px;display:block">'+
    '<defs><linearGradient id="g'+color.slice(1)+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+a+'" fill="url(#g'+color.slice(1)+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+((W-8)+4)+'" cy="'+(H-6-((last[1]-mn)/(mx-mn))*(H-16)).toFixed(1)+'" r="3.4" fill="'+color+'"/></svg>'+
    '<div style="display:flex;justify-content:space-between;color:var(--dim2);font-size:11px;padding:2px 4px 0">'+
    '<span>'+shortD(pts[0][0])+'</span><span>min '+fmt(mn+pad)+' · max '+fmt(mx-pad)+'</span><span>'+shortD(last[0])+'</span></div></div>';
}
function fmt(v){return Math.round(v*10)/10;}
function bars(vals,color){
  var W=320,H=70,n=vals.length,bw=(W-2)/n;
  var s='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:76px;display:block">';
  vals.forEach(function(p,i){
    var v=p[1]==null?0:p[1],h=Math.max(2,v*(H-6));
    s+='<rect x="'+(i*bw+1).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+(bw-1.6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.6" fill="'+(p[1]==null?"#252b39":color)+'" opacity="'+(p[1]==null?1:(.45+v*.55))+'"/>';
  });
  return s+'</svg></div>';
}
function pairBars(vals,ca,cb){ // vals: [[label,a,b]] with a/b null when no data
  var mx=1;vals.forEach(function(p){if(p[1]!=null&&p[1]>mx)mx=p[1];if(p[2]!=null&&p[2]>mx)mx=p[2];});
  var W=320,H=90,n=vals.length,gw=(W-2)/n,bw=(gw-3)/2;
  var s='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:96px;display:block">';
  vals.forEach(function(p,i){
    [[p[1],ca,0],[p[2],cb,1]].forEach(function(q){
      var h=q[0]==null?2:Math.max(2,q[0]/mx*(H-6));
      s+='<rect x="'+(i*gw+1+q[2]*(bw+1)).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.4" fill="'+(q[0]==null?"#252b39":q[1])+'"/>';
    });
  });
  return s+'</svg></div>';
}

function vTrends(){
  document.getElementById("hTitle").textContent="Trends";
  document.getElementById("hSub").textContent="Billing, consistency and body data";
  document.getElementById("hRight").innerHTML="";
  var d30=daysBack(30),d90=daysBack(90);
  var rec=d30.filter(function(k){return S.days[k];});

  var d7=daysBack(7),rec7=d7.filter(function(k){return S.days[k];});
  var avg7=rec7.length?rec7.reduce(function(a,k){return a+dayPct(k);},0)/rec7.length:0;
  var good=Object.keys(S.days).filter(function(k){return goodDay(k);}).length;
  var h='<div class="stats">'+
    '<div class="stat"><b style="color:var(--ok)">'+Math.round(avg7*100)+'%</b><span>last 7 days</span></div>'+

var wkStart=mondayOf(today());

function vReview(){
  document.getElementById("hTitle").textContent="Weekly review";
  var end=shift(wkStart,6);
  document.getElementById("hSub").textContent=shortD(wkStart)+" – "+shortD(end);
  document.getElementById("hRight").innerHTML="";
  var days=[];for(var i=0;i<7;i++)days.push(shift(wkStart,i));
  var rec=days.filter(function(k){return S.days[k];});

  var doneN=0,rollN=0,totN=0;

  var best=null,worst=null;

     '<div class="stat"><b style="color:var(--roll)">'+rollN+'</b><span>rolled over</span></div></div>';

       '<div class="stat"><b>'+W.med+' / '+W.medN+'</b><span>meditations</span></div>'+
       '<div class="stat"><b>'+W.train+'</b><span>training sessions</span></div></div>';

    h+='<div class="wk"><span class="n" style="flex:0 0 92px">'+DAY[parse(k).getDay()].slice(0,3)+' '+shortD(k)+'</span>'+

  });
  h+='</div>';
  if(best)h+='<div class="hint">Best day: <b>'+pretty(best).split(",")[0]+' '+shortD(best)+'</b> at '+Math.round(dayPct(best)*100)+'%. Weakest: <b>'+pretty(worst).split(",")[0]+' '+shortD(worst)+'</b> at '+Math.round(dayPct(worst)*100)+'%.</div>';

  if(W.newDays){

       '<div class="mrow"><span>My billable hours</span><b>'+fmt(W.my)+' h</b></div>'+
       '<div class="mrow"><span>Team billable hours</span><b>'+fmt(W.team)+' h</b></div>'+

       '<div class="nums flat" style="padding-top:0"><label class="wide"><span>Billing notes</span><input type="text" data-rv="bnotes" value="'+esc(R.bnotes||"")+'" placeholder="Matter with the widest billed-vs-collected gap…"></label></div></div>'+
       '<div class="hint">Hours fill in from each evening\'s <b>Billing numbers</b> entry.</div>';
    h+='<h2 class="sec">Health & tennis</h2><div class="card">'+
       '<div class="mrow"><span>Lights out on time</span><b>'+W.lightsDone+' / '+W.lightsN+'</b></div>'+
       '<div class="mrow"><span>Tennis sessions</span><b>'+W.tennis+'</b></div>'+
       '<div class="mrow"><span>Matches won – lost</span><b>'+W.w+' – '+W.l+'</b></div>';

  order.forEach(function(id){

    days.forEach(function(k){
      if(!scheduled(k,id)){cells+='<i style="background:#171b25"></i>';return;}
      if(k<=today())s++;var v=getS(k,id);
      if(v&&v.d){c++;cells+='<i style="background:'+it.color+'"></i>';}
      else if(v&&v.r)cells+='<i style="background:#5a4126"></i>';
      else cells+='<i></i>';
    });
    h+='<div class="wk"><span class="dot" style="background:'+it.color+'"></span><span class="n">'+esc(GEN[id]||it.x.label)+'</span><span class="d">'+cells+'</span><span class="c">'+c+'/'+s+'</span></div>';
  });
  h+='</div>';

  var mk=days.filter(function(k){return S.metrics[k];});
  if(mk.length){
    h+='<h2 class="sec">Body data this week</h2><div class="card">';
    METRICS.forEach(function(m){
      var vs=mk.map(function(k){return S.metrics[k][m.k];}).filter(function(v){return v!=null;});

      h+='<div class="mrow"><span>'+m.n+'</span><b style="color:'+m.c+'">'+fmt(av)+' '+m.u+'</b></div>';

      t+="Good days: "+W2.good+"/7 · meditations "+W2.med+"/"+W2.medN+" · training sessions "+W2.train+" · lights out on time "+W2.lightsDone+"/"+W2.lightsN+"\n";

      t+="  "+(GEN[id]||seen[id].x.label)+": "+c+"/"+s+"\n";});
    copy(t);
  };
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Copied");},function(){fallbackCopy(t);});}
  else fallbackCopy(t);
}
function fallbackCopy(t){
  var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
  try{document.execCommand("copy");toast("Copied");}catch(e){toast("Copy failed");}
  document.body.removeChild(a);
}

  document.getElementById("fi").onchange=function(e){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var o=JSON.parse(r.result);if(!o.days)throw 0;S=fix(o);TMEMO={};save();toast("Restored");render();}catch(x){toast("Bad backup file");}};
    r.readAsText(f);
  };
  document.getElementById("wipe").onclick=function(){
    if(confirm("Erase every day, note and metric? This cannot be undone.")){
      if(confirm("Really erase everything?")){S=blank();save();toast("Erased");curDate=today();render();}
    }
  };
}
function dl(name,txt,mime){
  var b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},400);
  toast("Saved — choose Save to Files");
}

/* ---------------- router ---------------- */
var view="today";
function render(){
  if(view==="today")vToday();
  else if(view==="log")vLog();
  else if(view==="trends")vTrends();
  else if(view==="review")vReview();
  else vMore();
  window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".nav button").forEach(function(o){o.classList.remove("on");});
    b.classList.add("on");view=b.dataset.v;
    if(view==="today")curDate=today();
    if(view==="review")wkStart=mondayOf(today());
    render();
  };
});
day(today(),true);
render();
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js");}catch(e){}
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",function(){if(document.hidden)save();});
